name: 构建 Docker 并推送到Docker Hub和GHCR

on:
    workflow_call:
        inputs:
            version:
                description: "应用版本"
                required: true
                type: string
            publish:
                description: "是否推送到镜像仓库；默认只构建本地镜像"
                required: false
                default: false
                type: boolean
            image_name:
                description: "Docker Hub 镜像名"
                required: false
                default: ""
                type: string
        secrets:
            DOCKER_PASSWORD:
                required: true

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write

        steps:
            - name: 拉取代码
              uses: actions/checkout@ff7abcd0c3c05ccf6adc123a8cd1fd4fb30fb493

            - name: 下载 Web 版本构建产物
              uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
              with:
                  name: ${{ inputs.version }}-web

            - name: 解压 Web 版本构建产物
              env:
                  VERSION: ${{ inputs.version }}
              run: unzip -q "Xero.QQ.Lite-${VERSION}-web.zip"

            - name: 设置 Docker Buildx
              uses: docker/setup-buildx-action@1583c0f09d26c58c59d25b0eef29792b7ce99d9a

            - name: 登录 Docker Hub
              if: inputs.publish && secrets.DOCKER_PASSWORD != ''
              uses: docker/login-action@28fdb31ff34708d19615a74d67103ddc2ea9725c
              with:
                  username: ${{ github.repository_owner }}
                  password: ${{ secrets.DOCKER_PASSWORD }}

            - name: 登录 GitHub Container Registry
              if: inputs.publish
              uses: docker/login-action@28fdb31ff34708d19615a74d67103ddc2ea9725c
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: 构建 Docker 镜像（默认不推送）
              if: ${{ !inputs.publish }}
              run: |
                  docker buildx build \
                    --platform linux/amd64,linux/arm64 \
                    -t xero-qq-lite:local \
                    --output=type=oci,dest=xero-qq-lite.oci.tar \
                    .

            - name: 构建并推送 Docker 镜像到显式配置的仓库
              if: inputs.publish
              run: |
                  if [ -z "${{ inputs.image_name }}" ]; then
                    echo "image_name is required when publish=true" >&2
                    exit 1
                  fi
                  GHCR_IMAGE_NAME=$(echo "ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:latest" | tr '[:upper:]' '[:lower:]')

                  docker buildx build \
                    --platform linux/amd64,linux/arm64 \
                    -t "${{ inputs.image_name }}:${{ inputs.version }}" \
                    -t $GHCR_IMAGE_NAME \
                    --push .
