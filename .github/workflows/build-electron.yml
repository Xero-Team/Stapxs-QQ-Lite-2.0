name: 构建 Electron

on:
    workflow_call:
        inputs:
            version:
                description: "应用版本"
                required: true
                type: string

jobs:
    build:
        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                os: [windows-2022, ubuntu-latest, macos-latest]

        steps:
            - name: 安装构建依赖
              if: matrix.os == 'ubuntu-latest'
              run: |
                  sudo apt update
                  sudo apt install -y libarchive-tools
            - name: 拉取代码
              uses: actions/checkout@v4
              with:
                  submodules: recursive
            - name: 设置 pnpm
              uses: pnpm/action-setup@v4
            - name: 设置 Nodejs
              uses: actions/setup-node@v4
              with:
                  node-version: 22.x
                  cache: pnpm
            - name: 更新依赖
              run: pnpm install --frozen-lockfile --ignore-scripts

            - name: 构建 Electron 应用
              run: pnpm build:electron
              env:
                  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

            - name: 记录 Electron 产物指标
              run: node scripts/measure-artifact-metrics.mjs dist_electron

            - name: 生成 Electron 产物校验和
              working-directory: dist_electron
              run: find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS

            - name: 上传构建产物
              uses: actions/upload-artifact@v4
              with:
                  name: ${{ inputs.version }}-${{ matrix.os }}
                  path: dist_electron
