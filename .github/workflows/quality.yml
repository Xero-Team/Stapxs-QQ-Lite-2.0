name: Quality gates

on:
    pull_request:
    push:
        branches: [next]

permissions:
    contents: read

jobs:
    quality:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout with compatibility assets
              uses: actions/checkout@v4
              with:
                  submodules: recursive
                  persist-credentials: false
            - name: Setup Node 22 and Yarn 4
              uses: actions/setup-node@v4
              with:
                  node-version: 22.x
                  cache: yarn
            - name: Enable Corepack
              run: corepack enable
            - name: Install dependencies
              run: yarn install --immutable
            - name: Check patch whitespace
              run: git diff --check
            - name: TypeScript strict check
              run: yarn typecheck
            - name: Electron TypeScript check
              run: npx tsc --noEmit -p tsconfig.node.json
            - name: OneBot contract tests
              run: yarn test:contract
            - name: Lint protocol and platform primitives
              run: yarn eslint src/renderer/src/protocol src/renderer/src/transport src/renderer/src/storage src/renderer/src/network src/electron/function/ipc.ts src/electron/function/urlPolicy.ts src/electron/function/util.ts tests
            - name: Dependency audit
              run: yarn npm audit --all --recursive
            - name: Web build
              run: yarn build
            - name: Electron renderer build
              run: yarn electron-vite build
              env:
                  DESKTOP: '1'
            - name: Install Chromium for Playwright smoke
              run: npx --yes playwright install --with-deps chromium
            - name: Start Web preview
              run: |
                  yarn preview --host 127.0.0.1 > /tmp/xero-qq-lite-preview.log 2>&1 &
                  for attempt in $(seq 1 30); do
                    curl --fail --silent http://127.0.0.1:4173/ >/dev/null && exit 0
                    sleep 1
                  done
                  cat /tmp/xero-qq-lite-preview.log
                  exit 1
            - name: Playwright smoke
              run: bash scripts/playwright-smoke.sh
            - name: Rust check
              run: yarn lint:tauri
