name: Quality gates

on:
    pull_request:
    push:
        branches: [next]

permissions:
    contents: read

jobs:
    quality:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - name: Checkout with compatibility assets
              uses: actions/checkout@v4
              with:
                  submodules: recursive
                  persist-credentials: false
            - name: Setup pnpm
              uses: pnpm/action-setup@v4
            - name: Setup Node 22
              uses: actions/setup-node@v4
              with:
                  node-version: 22.x
                  cache: pnpm
            - name: Install dependencies
              run: pnpm install --frozen-lockfile --ignore-scripts
            - name: Check patch whitespace
              run: git diff --check
            - name: Verify repository policy
              run: pnpm verify:repository-policy
            - name: TypeScript strict check
              run: pnpm typecheck
            - name: Browser harness strict check
              run: pnpm typecheck:browser
            - name: Electron TypeScript check
              run: npx tsc --noEmit -p tsconfig.node.json
            - name: OneBot contract tests
              run: pnpm test:contract
            - name: Lint protocol and platform primitives
              run: pnpm exec eslint src/renderer/src/protocol src/renderer/src/transport src/renderer/src/storage src/renderer/src/network src/renderer/src/function/utils/avatar.ts src/electron/function/ipc.ts src/electron/function/urlPolicy.ts src/electron/function/util.ts tests scripts/playwright-auth-failure-smoke.js scripts/playwright-onebot-smoke.js scripts/playwright-xml-card-smoke.js scripts/playwright-storage-smoke.js
            - name: Generate dependency inventory and SBOM
              run: pnpm sbom
            - name: Web build
              run: pnpm build
            - name: Verify SBOM, licenses and CSP
              run: pnpm verify:release-metadata dist
            - name: Electron renderer build
              run: pnpm exec electron-vite build
              env:
                  DESKTOP: '1'
            - name: Install Chromium for Playwright smoke
              run: npx --yes --package @playwright/cli@0.1.19 playwright-cli install-browser --with-deps chromium
            - name: Start Web preview
              run: |
                  pnpm preview --host 127.0.0.1 --strictPort > /tmp/xero-qq-lite-preview.log 2>&1 &
                  for attempt in $(seq 1 30); do
                    curl --fail --silent http://127.0.0.1:4173/ >/dev/null && exit 0
                    sleep 1
                  done
                  cat /tmp/xero-qq-lite-preview.log
                  exit 1
            - name: Playwright smoke
              run: bash scripts/playwright-smoke.sh
            - name: Settings migration UI smoke
              run: bash scripts/playwright-settings-migration-smoke.sh
            - name: Authentication failure UI smoke
              run: bash scripts/playwright-auth-failure-smoke.sh
            - name: Upload browser runtime metrics
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: browser-runtime-metrics
                  path: output/playwright/runtime-metrics.json
                  if-no-files-found: warn
            - name: Start XML card browser harness
              run: |
                  ./node_modules/.bin/vite --config tests/browser/vite.config.ts > /tmp/xero-xml-harness.log 2>&1 &
                  echo $! > "$RUNNER_TEMP/xero-xml-harness.pid"
                  for attempt in $(seq 1 30); do
                    curl --fail --silent http://127.0.0.1:4174/ >/dev/null && exit 0
                    sleep 1
                  done
                  cat /tmp/xero-xml-harness.log
                  exit 1
            - name: XML card privacy and injection smoke
              run: bash scripts/playwright-xml-card-smoke.sh
            - name: Local storage migration and rollback smoke
              run: bash scripts/playwright-storage-smoke.sh
            - name: Playwright OneBot login smoke
              run: bash scripts/playwright-onebot-smoke.sh
            - name: Rust check
              run: pnpm lint:tauri

    dependency-audit:
        # Audit failures must still fail the workflow without skipping browser coverage.
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  persist-credentials: false
            - name: Setup pnpm
              uses: pnpm/action-setup@v4
            - name: Setup Node 22
              uses: actions/setup-node@v4
              with:
                  node-version: 22.x
                  cache: pnpm
            - name: Install dependencies
              run: pnpm install --frozen-lockfile --ignore-scripts
            - name: Dependency audit
              run: pnpm audit --recursive --ignore-unfixable
