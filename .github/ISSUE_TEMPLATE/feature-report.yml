name: 功能请求
description: 有什么新的功能想法？欢迎提交。
body:
    - type: markdown
      attributes:
          value: |
              在开始提交功能请求前，请先检查 Xero-Team 里程碑中的计划事项，避免重复提交。
    - type: dropdown
      attributes:
          label: 适用版本
          options:
              - Stapxs QQ Lite（All）
              - Stapxs QQ Lite（Web）
              - Stapxs QQ Lite（Electron/Tauri）
              - Stapxs QQ Lite (Android)
              - Stapxs QQ Lite (iOS/iPadOS)
              - 其他
    - type: textarea
      attributes:
          label: 描述请求
          description: 你想要什么功能呢？简单说一下就好了（x
    - type: textarea
      attributes:
          label: 截图
          description: 如果有附加的截图，可以添加在下面
